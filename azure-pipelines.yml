trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  CI: 'true'
  BASE_URL: 'https://qa-sandbox.ni.htec.rs'

steps:
  - task: NodeTool@0
    displayName: 'Install Node.js 20.x'
    inputs:
      versionSpec: '20.x'

  - script: npm ci
    displayName: 'Install dependencies'

  - script: npx playwright install --with-deps
    displayName: 'Install Playwright browsers'

  - script: mkdir -p reports/junit reports/html-report
    displayName: 'Create reports directories'

  - script: npm run test:ci
    displayName: 'Run Playwright tests (parallel, 2 browsers)'
    continueOnError: true
    env:
      CI: $(CI)
      BASE_URL: $(BASE_URL)

  - task: PublishTestResults@2
    displayName: 'Publish JUnit test results'
    condition: always()
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: 'reports/junit/results.xml'
      failTaskOnFailedTests: false
      testRunTitle: 'Playwright Tests'

  - task: PublishBuildArtifacts@1
    displayName: 'Publish HTML report'
    condition: always()
    inputs:
      PathtoPublish: 'reports/html-report'
      ArtifactName: 'html-report'
      publishLocation: 'Container'

  - task: PublishBuildArtifacts@1
    displayName: 'Publish test videos'
    condition: always()
    inputs:
      PathtoPublish: 'test-results'
      ArtifactName: 'test-results'
      publishLocation: 'Container'

  - script: |
      echo "## Test Results"
      echo "HTML Report and videos published as artifacts"
    displayName: 'Test summary'
    condition: always()
