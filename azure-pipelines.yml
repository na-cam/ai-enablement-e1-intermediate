trigger:
  branches:
    include: [main, develop]

pr:
  branches:
    include: [main, develop]

# Nightly run (UTC)
schedules:
  - cron: '0 1 * * *'
    displayName: Nightly build
    branches:
      include: [main]
    always: true

pool:
  vmImage: 'ubuntu-latest'

parameters:
  - name: testEnv
    displayName: Target environment
    type: string
    default: qa

variables:
  CI: 'true'
  TEST_ENV: ${{ parameters.testEnv }}

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'

  - script: npm ci
    displayName: Install dependencies

  - script: npm run typecheck && npm run lint
    displayName: Static analysis

  - script: npx playwright install --with-deps chromium webkit
    displayName: Install Playwright browsers

  - script: npm run test:ci
    displayName: Run tests (parallel)
    env:
      TEST_EMAIL: $(TEST_EMAIL)
      TEST_PASSWORD: $(TEST_PASSWORD)

  - task: PublishTestResults@2
    condition: always()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: reports/junit/results.xml
      testRunTitle: Playwright ($(TEST_ENV))

  - task: PublishBuildArtifacts@1
    condition: always()
    displayName: Publish full report (HTML + videos + logs)
    inputs:
      PathtoPublish: reports
      ArtifactName: playwright-report
