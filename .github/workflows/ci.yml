name: Playwright Tests CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 1 * * *' # nightly, 01:00 UTC
  workflow_dispatch:
    inputs:
      test_env:
        description: 'Target environment (TEST_ENV)'
        default: 'qa'

jobs:
  lint:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  test:
    name: Tests (UI chromium + webkit, API)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      TEST_ENV: ${{ github.event.inputs.test_env || 'qa' }}
      TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit

      - name: Run tests (parallel)
        run: npm run test:ci

      # Everything generated lives in ./reports (HTML, JUnit, videos, traces, logs).
      # One artifact, and the job fails loudly if the folder is empty.
      - name: Publish full report (HTML + videos + logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          echo "## Test run (${TEST_ENV})" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the **playwright-report** artifact and open html-report/index.html." >> "$GITHUB_STEP_SUMMARY"
